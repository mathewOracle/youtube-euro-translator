[project]
name = "yt-euro-translator"
version = "0.1.0"
description = "Translate any YouTube video's spoken content into any European language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mathewOracle" }]
keywords = ["youtube", "translation", "subtitles", "srt", "i18n"]

dependencies = [
    "youtube-transcript-api>=1.2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
asr = ["openai-whisper>=20231117", "yt-dlp>=2024.1.1", "truststore>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
yt-translate = "yt_translator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_translator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires calls (typer.Option/Argument) as parameter defaults; B008
# exists to catch accidental mutable defaults, which is not what these are.
"src/yt_translator/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
