<div role="alert"
     class="rounded-lg border-2 border-red-300 bg-red-50 px-6 py-5">
  <h2 class="font-bold text-red-900">Could not translate this video</h2>
  <p class="mt-1 text-red-900">{{ message }}</p>
  <p class="mt-3 text-sm text-red-800">
    Most often this means the video has no captions, or its owner disabled them.
    Try another video.
  </p>
</div>
